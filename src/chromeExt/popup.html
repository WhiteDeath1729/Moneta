<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moneta</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 340px;
            min-height: 240px;
            background: #171717;
            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            padding: 22px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: #f5f5f5;
            color: #171717;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            font-weight: bold;
        }

        .brand {
            font-size: 21px;
            font-weight: 600;
        }

        .subtitle {
            color: #8f8f8f;
            font-size: 12px;
            margin-top: 3px;
        }

        .status-card {
            background: #222222;
            border: 1px solid #303030;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 16px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
        }

        .dot.connected {
            background: #5cff9d;
            box-shadow: 0 0 8px rgba(92, 255, 157, 0.5);
        }

        .dot.error {
            background: #ff5c5c;
        }

        .count {
            margin-top: 12px;
            font-size: 28px;
            font-weight: 600;
        }

        .count-label {
            color: #8f8f8f;
            font-size: 12px;
            margin-top: 2px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 13px;
            background: #f5f5f5;
            color: #171717;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }

        button:hover {
            background: #ffffff;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
            transform: none;
        }

        .message {
            text-align: center;
            color: #888;
            font-size: 11px;
            margin-top: 13px;
            min-height: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">M</div>

        <div>
            <div class="brand">Moneta</div>
            <div class="subtitle">Bookmark Bridge</div>
        </div>
    </div>

    <div class="status-card">

        <div class="status">
            <div id="statusDot" class="dot"></div>
            <span id="statusText">Checking Moneta...</span>
        </div>

        <div id="count" class="count">—</div>

        <div class="count-label">
            bookmarks ready to sync
        </div>

    </div>

    <button id="syncButton">
        Sync Bookmarks
    </button>

    <div id="message" class="message"></div>

</div>

<script src="popup.js"></script>

</body>
</html>
