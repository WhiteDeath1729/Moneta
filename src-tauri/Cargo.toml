[package]
name = "moneta-app"
version = "0.1.0"
description = "Moneta - Obsidian-style Local AI Knowledge & Bookmark Vault"
authors = ["Moneta Team"]
edition = "2021"

[lib]
name = "moneta_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "moneta"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
moneta = { path = ".." }
tauri = { version = "2.12.3", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
global-hotkey = "0.8.0"
tauri-plugin-single-instance = "2"
rfd = "0.17.2"
winreg = "0.55"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
tokio = { version = "1", features = ["full"] }
rusqlite = "0.33"
