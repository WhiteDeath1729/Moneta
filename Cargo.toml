[package]
name = "moneta"
version = "0.1.0"
edition = "2024"

[dependencies]
global-hotkey = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
leptess = "0.14"
rfd = "0.17.2"
winit = "0.30"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }